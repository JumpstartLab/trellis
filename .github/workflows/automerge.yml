name: Auto-merge

# The `automerge` label is the interface and it has not changed: label a PR and
# it merges when CI is green. What changed is everything underneath.
#
# This turns on GitHub's native auto-merge and gets out of the way. GitHub holds
# the merge until the branch ruleset's required `ci` context reports green, then
# squashes. There is no polling, no CI-result inspection and no waiting job,
# because there is no longer anything to wait for here — the ruleset is the gate.
#
# The previous version of this workflow did all of that by hand, correctly, for
# a constraint that no longer exists: the org was on the free plan, where private
# repos get no branch protection. It moved to Team on 2026-09-10.
on:
  pull_request:
    types: [labeled, opened, reopened, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    if: contains(github.event.pull_request.labels.*.name, 'automerge')
    runs-on: ubuntu-latest
    # Resolved here rather than in a step `if:` — the secrets context is
    # reliably available to job-level env, and this is the shape the workflow
    # this replaced already used.
    env:
      HAS_PAT: ${{ secrets.AUTOMERGE_PAT != '' }}
    steps:
      # Enabling auto-merge on a PR with no required checks does not wait — it
      # merges immediately. So an ungated repo is not a harmless no-op here, it
      # is a merge that CI never saw. Fail loudly instead.
      - name: Refuse to queue a merge nothing will gate
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          gated=$(gh api "repos/$REPO/rules/branches/$BASE" \
            --jq '[ .[] | select(.type == "required_status_checks")
                    | .parameters.required_status_checks[].context ]
                  | index("ci") != null')
          if [ "$gated" != "true" ]; then
            echo "::error::$BASE on $REPO does not require the 'ci' status check, so"
            echo "auto-merge would merge this PR without waiting for CI. Refusing."
            echo "Fix the ruleset, or drop the automerge label and merge by hand."
            exit 1
          fi
          echo "'ci' is required on $BASE — safe to queue."

      # AUTOMERGE_PAT matters more than it looks. GitHub deliberately does not
      # trigger workflows from a push made with GITHUB_TOKEN (the anti-recursion
      # rule), and native auto-merge performs the merge as whoever ENABLED it.
      # Enable it as github-actions[bot] and the merge commit lands on the
      # default branch having triggered nothing at all — no deploy, and no CI on
      # the default branch either.
      - name: Queue the merge
        env:
          GH_TOKEN: ${{ secrets.AUTOMERGE_PAT || github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          gh pr merge "$NUMBER" --repo "$REPO" --auto --squash --delete-branch
          echo "Auto-merge enabled on #$NUMBER; GitHub will land it when 'ci' is green."

      # Deliberately AFTER the merge is queued, and deliberately fatal.
      #
      # Without a PAT the merge still happens and is still gated on CI, so
      # blocking it would cost more than it saves. What is lost is everything
      # the merge push should have triggered — which fails silently: CI is green,
      # the PR merges, every dashboard agrees, and production simply stops
      # changing. Frontier lost 18 merges and four and a half hours to exactly
      # this on 2026-09-10.
      #
      # A red check here is the only thing standing between that and nobody
      # noticing. If this repo genuinely has nothing that runs on a push to its
      # default branch, the fix is still to set the secret rather than to make
      # this conditional — one invariant, no per-repo exceptions to remember.
      - name: A bot merge triggers nothing downstream
        if: env.HAS_PAT != 'true'
        run: |
          echo "::error::AUTOMERGE_PAT is not set on ${{ github.repository }}."
          echo ""
          echo "This PR will merge, gated on CI as normal. But the merge will be"
          echo "attributed to github-actions[bot], and GitHub does not trigger"
          echo "workflows from a GITHUB_TOKEN push. So nothing will run on the"
          echo "resulting push to the default branch — including any deploy."
          echo ""
          echo "Fix: set an AUTOMERGE_PAT secret (org-level covers every repo at"
          echo "once). Until then, dispatch the deploy by hand after this merges:"
          echo "  gh workflow run deploy.yml --repo ${{ github.repository }}"
          exit 1
